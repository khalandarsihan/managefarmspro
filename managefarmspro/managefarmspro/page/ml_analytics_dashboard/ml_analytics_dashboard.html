<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>

<div class="ml-analytics-dashboard">
    <div class="container-fluid">
        <!-- Model Status Banner -->
        <div id="model-status-banner" class="mb-4"></div>
        
        <!-- Summary Cards -->
        <div id="summary-cards" class="row mb-4"></div>
        
        <!-- Charts Row -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Cost Trends (Jan 2025 - Sep 2025)</h5>
                        <canvas id="cost-trends-chart" height="300"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fa fa-pie-chart text-primary"></i> Work Type Distribution</h5>
                        <canvas id="work-distribution-chart" height="300"></canvas>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Budget Alerts and Seasonal Patterns -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-warning text-dark">
                        <i class="fa fa-exclamation-triangle"></i> Budget Alerts
                    </div>
                    <div class="card-body" id="budget-alerts-container">
                        <div class="text-center text-muted">Loading alerts...</div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Seasonal Patterns</h5>
                        <div id="seasonal-patterns-container">
                            <div class="text-center text-muted">Loading patterns...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Prediction Tools -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        Cost Prediction Tool
                    </div>
                    <div class="card-body" id="cost-prediction-container"></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        Budget Forecast
                    </div>
                    <div class="card-body" id="budget-forecast-container"></div>
                </div>
            </div>
        </div>
        
        <!-- Monthly Spending Table -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fa fa-table"></i> Monthly Spending by Plot</h5>
                        <div id="monthly-spending-container">
                            <div class="text-center text-muted">Loading data...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
